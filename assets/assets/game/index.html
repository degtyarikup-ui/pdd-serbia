<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDD 3D Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8F8FA;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: transparent;
      z-index: 100;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid #EFF0F4;
      border-top: 3.5px solid #0574F8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 14px;
      font-weight: 500;
      color: #A1A6B7;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <!-- Plain cover only: the loading screen itself is drawn by Flutter on top
       of the WebView, so nothing here must ever show through. -->
  <div id="loading-overlay"></div>

  <script src="three.min.js"></script>
  <script src="sign-textures.js"></script>
  <script src="scenario-routes.js"></script>
  <script src="road-situations.js"></script>
    <script src="junction-situations.js"></script>
  <script src="scene-edits.js"></script>
  <script src="model-edits.js"></script>
  <script src="vehicle-materials.js"></script>
  <script src="vehicles.js"></script>
  <script src="road-materials.js"></script>
  <script src="browser-bridge.js"></script>
  <script src="game.js"></script>
</body>
</html>
